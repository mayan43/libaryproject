<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 8 - Task 2</title>
</head>
<body>
    <h1>Books: Edition > 3 and (Title or Author contains 'qu')</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Edition</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.edition }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5">No books found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
